<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050c18"/>
      <stop offset="100%" stop-color="#0d1e38"/>
    </linearGradient>
    <radialGradient id="glowGold" cx="12%" cy="18%" r="44%">
      <stop offset="0%" stop-color="#f2c94c" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="86%" cy="76%" r="38%">
      <stop offset="0%" stop-color="#4dd9e8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#4dd9e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c94c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f2c94c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topEdge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2c94c" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#f2c94c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f2c94c" stop-opacity="0"/>
    </linearGradient>
    <filter id="goldBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ulBloom" x="-10%" y="-300%" width="120%" height="700%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="rounded"><rect width="600" height="200" rx="18"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" rx="18" fill="url(#bg)"/>
  <rect width="600" height="200" rx="18" fill="url(#glowGold)" clip-path="url(#rounded)"/>
  <rect width="600" height="200" rx="18" fill="url(#glowCyan)" clip-path="url(#rounded)"/>

  <!-- Border -->
  <rect x="0.75" y="0.75" width="598.5" height="198.5" rx="17.5"
        fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>

  <!-- Top gold accent line -->
  <line x1="18" y1="1" x2="220" y2="1" stroke="url(#topEdge)" stroke-width="2"/>

  <!-- Particle network (top-right) -->
  <circle cx="516" cy="38" r="1.8" fill="#f2c94c" opacity="0.5"/>
  <circle cx="549" cy="66" r="1.2" fill="#4dd9e8" opacity="0.4"/>
  <circle cx="565" cy="26" r="2.2" fill="#f2c94c" opacity="0.28"/>
  <circle cx="582" cy="52" r="1.4" fill="#e8f0ff" opacity="0.2"/>
  <line x1="516" y1="38" x2="549" y2="66" stroke="rgba(180,200,255,0.14)" stroke-width="0.8"/>
  <line x1="549" y1="66" x2="565" y2="26" stroke="rgba(180,200,255,0.11)" stroke-width="0.8"/>
  <line x1="565" y1="26" x2="582" y2="52" stroke="rgba(180,200,255,0.09)" stroke-width="0.8"/>

  <!-- Particle network (bottom-right) -->
  <circle cx="492" cy="158" r="1.6" fill="#4dd9e8" opacity="0.35"/>
  <circle cx="536" cy="150" r="1.2" fill="#f2c94c" opacity="0.42"/>
  <circle cx="571" cy="168" r="1.8" fill="#e8f0ff" opacity="0.18"/>
  <line x1="492" y1="158" x2="536" y2="150" stroke="rgba(180,200,255,0.12)" stroke-width="0.8"/>
  <line x1="536" y1="150" x2="571" y2="168" stroke="rgba(180,200,255,0.1)" stroke-width="0.8"/>

  <!-- AI halo glow (positioned behind AI text) -->
  <ellipse cx="248" cy="95" rx="68" ry="58" fill="url(#aiHalo)"/>

  <!-- WORDMARK -->
  <!-- EPI (white) -->
  <text x="44" y="124"
    font-family="'Bricolage Grotesque', 'Georgia', 'Times New Roman', serif"
    font-size="90" font-weight="900"
    letter-spacing="-3"
    fill="#e8f0ff">EPI</text>

  <!-- AI (gold with bloom) -->
  <text x="225" y="124"
    font-family="'Bricolage Grotesque', 'Georgia', 'Times New Roman', serif"
    font-size="90" font-weight="900"
    letter-spacing="-3"
    fill="#f2c94c"
    filter="url(#goldBloom)">AI</text>

  <!-- DEA (white) -->
  <text x="316" y="124"
    font-family="'Bricolage Grotesque', 'Georgia', 'Times New Roman', serif"
    font-size="90" font-weight="900"
    letter-spacing="-3"
    fill="#e8f0ff">DEA</text>

  <!-- Gold underline under AI -->
  <rect x="225" y="132" width="84" height="3" rx="1.5"
        fill="#f2c94c" filter="url(#ulBloom)"/>

  <!-- Tagline -->
  <text x="44" y="162"
    font-family="'Instrument Sans', 'Helvetica Neue', Arial, sans-serif"
    font-size="11.5" font-weight="500"
    letter-spacing="2.2"
    fill="#96aacf" opacity="0.9">EPIDEMIOLOGY  ·  AI  ·  DATA  ·  EVIDENCE  ·  ACTION</text>
</svg>
