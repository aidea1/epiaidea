<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020810"/>
      <stop offset="60%" style="stop-color:#050c18"/>
      <stop offset="100%" style="stop-color:#030a14"/>
    </linearGradient>

    <!-- Gold glow radial -->
    <radialGradient id="goldGlow" cx="30%" cy="25%" r="55%">
      <stop offset="0%" style="stop-color:#f2c94c;stop-opacity:0.13"/>
      <stop offset="100%" style="stop-color:#f2c94c;stop-opacity:0"/>
    </radialGradient>

    <!-- Cyan glow radial -->
    <radialGradient id="cyanGlow" cx="80%" cy="15%" r="45%">
      <stop offset="0%" style="stop-color:#4dd9e8;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#4dd9e8;stop-opacity:0"/>
    </radialGradient>

    <!-- Bottom right accent -->
    <radialGradient id="bottomGlow" cx="85%" cy="85%" r="40%">
      <stop offset="0%" style="stop-color:#f2c94c;stop-opacity:0.06"/>
      <stop offset="100%" style="stop-color:#f2c94c;stop-opacity:0"/>
    </radialGradient>

    <!-- Gold line gradient for wordmark underline -->
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f2c94c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f2c94c;stop-opacity:0"/>
    </linearGradient>

    <!-- Top border gradient -->
    <linearGradient id="topBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f2c94c;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#f2c94c;stop-opacity:0.6"/>
      <stop offset="70%" style="stop-color:#4dd9e8;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#4dd9e8;stop-opacity:0"/>
    </linearGradient>

    <!-- Filter: gold glow on text -->
    <filter id="goldTextGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filter: subtle soft glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for border -->
    <clipPath id="mainClip">
      <rect width="1920" height="1080"/>
    </clipPath>

    <!-- Noise texture pattern -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  <rect width="1920" height="1080" fill="url(#goldGlow)"/>
  <rect width="1920" height="1080" fill="url(#cyanGlow)"/>
  <rect width="1920" height="1080" fill="url(#bottomGlow)"/>

  <!-- Noise overlay -->
  <rect width="1920" height="1080" fill="#e8f0ff" opacity="0.018" filter="url(#noise)"/>

  <!-- ── GRID LINES (subtle) ── -->
  <!-- Horizontal faint grid -->
  <line x1="0" y1="270" x2="1920" y2="270" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="540" x2="1920" y2="540" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <line x1="0" y1="810" x2="1920" y2="810" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <!-- Vertical faint grid -->
  <line x1="480" y1="0" x2="480" y2="1080" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="1080" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <line x1="1440" y1="0" x2="1440" y2="1080" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>

  <!-- ── PARTICLE DOTS ── -->
  <!-- Gold particles -->
  <circle cx="120" cy="180" r="1.8" fill="#f2c94c" opacity="0.5"/>
  <circle cx="280" cy="90" r="1.2" fill="#f2c94c" opacity="0.35"/>
  <circle cx="1680" cy="200" r="2" fill="#f2c94c" opacity="0.45"/>
  <circle cx="1820" cy="80" r="1.4" fill="#f2c94c" opacity="0.3"/>
  <circle cx="1750" cy="900" r="1.8" fill="#f2c94c" opacity="0.4"/>
  <circle cx="160" cy="920" r="1.5" fill="#f2c94c" opacity="0.35"/>
  <circle cx="400" cy="950" r="1" fill="#f2c94c" opacity="0.25"/>
  <circle cx="350" cy="300" r="1.3" fill="#f2c94c" opacity="0.3"/>
  <circle cx="1580" cy="750" r="1.6" fill="#f2c94c" opacity="0.38"/>
  <circle cx="1850" cy="600" r="1.2" fill="#f2c94c" opacity="0.28"/>
  <circle cx="70" cy="550" r="1.4" fill="#f2c94c" opacity="0.32"/>
  <circle cx="1900" cy="400" r="1" fill="#f2c94c" opacity="0.22"/>

  <!-- Cyan particles -->
  <circle cx="1720" cy="140" r="1.6" fill="#4dd9e8" opacity="0.4"/>
  <circle cx="1860" cy="320" r="1.2" fill="#4dd9e8" opacity="0.3"/>
  <circle cx="220" cy="800" r="1.4" fill="#4dd9e8" opacity="0.35"/>
  <circle cx="80" cy="380" r="1" fill="#4dd9e8" opacity="0.28"/>
  <circle cx="1600" cy="980" r="1.3" fill="#4dd9e8" opacity="0.3"/>
  <circle cx="900" cy="60" r="1.5" fill="#4dd9e8" opacity="0.33"/>
  <circle cx="1100" cy="1020" r="1.2" fill="#4dd9e8" opacity="0.28"/>

  <!-- White/dim particles -->
  <circle cx="600" cy="120" r="1" fill="#e8f0ff" opacity="0.2"/>
  <circle cx="1300" cy="80" r="1.3" fill="#e8f0ff" opacity="0.18"/>
  <circle cx="750" cy="980" r="1.1" fill="#e8f0ff" opacity="0.2"/>
  <circle cx="1450" cy="960" r="0.9" fill="#e8f0ff" opacity="0.15"/>

  <!-- ── CONNECTING LINES (particle network feel) ── -->
  <line x1="120" y1="180" x2="280" y2="90" stroke="rgba(180,200,255,0.08)" stroke-width="0.8"/>
  <line x1="1680" y1="200" x2="1720" y2="140" stroke="rgba(77,217,232,0.1)" stroke-width="0.8"/>
  <line x1="1720" y1="140" x2="1820" y2="80" stroke="rgba(180,200,255,0.07)" stroke-width="0.8"/>
  <line x1="1720" y1="140" x2="1860" y2="320" stroke="rgba(77,217,232,0.08)" stroke-width="0.8"/>
  <line x1="160" y1="920" x2="220" y2="800" stroke="rgba(180,200,255,0.08)" stroke-width="0.8"/>
  <line x1="220" y1="800" x2="80" y2="550" stroke="rgba(180,200,255,0.06)" stroke-width="0.8"/>
  <line x1="1750" y1="900" x2="1600" y2="980" stroke="rgba(242,201,76,0.08)" stroke-width="0.8"/>
  <line x1="1580" y1="750" x2="1750" y2="900" stroke="rgba(180,200,255,0.07)" stroke-width="0.8"/>

  <!-- ── TOP ACCENT BORDER ── -->
  <rect x="0" y="0" width="1920" height="2" fill="url(#topBorder)"/>

  <!-- ── BOTTOM ACCENT LINE ── -->
  <rect x="0" y="1078" width="1920" height="2" fill="url(#topBorder)" opacity="0.5"/>

  <!-- ── LEFT SIDE ACCENT ── -->
  <rect x="0" y="0" width="2" height="1080" fill="#f2c94c" opacity="0.15"/>

  <!-- ── DECORATIVE CORNER MARKS ── -->
  <!-- Top-left -->
  <line x1="60" y1="52" x2="100" y2="52" stroke="#f2c94c" stroke-width="1.5" opacity="0.5"/>
  <line x1="60" y1="52" x2="60" y2="92" stroke="#f2c94c" stroke-width="1.5" opacity="0.5"/>
  <!-- Top-right -->
  <line x1="1860" y1="52" x2="1820" y2="52" stroke="#4dd9e8" stroke-width="1.5" opacity="0.45"/>
  <line x1="1860" y1="52" x2="1860" y2="92" stroke="#4dd9e8" stroke-width="1.5" opacity="0.45"/>
  <!-- Bottom-left -->
  <line x1="60" y1="1028" x2="100" y2="1028" stroke="#f2c94c" stroke-width="1.5" opacity="0.4"/>
  <line x1="60" y1="1028" x2="60" y2="988" stroke="#f2c94c" stroke-width="1.5" opacity="0.4"/>
  <!-- Bottom-right -->
  <line x1="1860" y1="1028" x2="1820" y2="1028" stroke="#4dd9e8" stroke-width="1.5" opacity="0.4"/>
  <line x1="1860" y1="1028" x2="1860" y2="988" stroke="#4dd9e8" stroke-width="1.5" opacity="0.4"/>

  <!-- ── LARGE BACKGROUND CIRCLES (atmosphere) ── -->
  <circle cx="960" cy="540" r="420" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1"/>
  <circle cx="960" cy="540" r="600" fill="none" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>

  <!-- ── CENTER CONTENT GROUP ── -->
  <g transform="translate(960, 480)">

    <!-- Eyebrow label -->
    <rect x="-120" y="-210" width="240" height="26" rx="13" fill="rgba(77,217,232,0.1)" stroke="rgba(77,217,232,0.3)" stroke-width="1"/>
    <circle cx="-100" cy="-197" r="4" fill="#4dd9e8" opacity="0.9"/>
    <text x="-88" y="-192" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#4dd9e8" text-anchor="start" dominant-baseline="middle">DIGITAL EPIDEMIOLOGY PLATFORM</text>

    <!-- ── MAIN WORDMARK ── -->
    <!-- EPI -->
    <text x="-470" y="-80" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="210" font-weight="900" letter-spacing="-4" fill="#e8f0ff" opacity="0.97">EPI</text>
    <!-- AI in gold with glow -->
    <text x="-50" y="-80" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="210" font-weight="900" letter-spacing="-4" fill="#f2c94c" filter="url(#goldTextGlow)">AI</text>
    <!-- DEA -->
    <text x="200" y="-80" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="210" font-weight="900" letter-spacing="-4" fill="#e8f0ff" opacity="0.97">DEA</text>

    <!-- Gold underline accent under AI -->
    <rect x="-50" y="-24" width="248" height="4" rx="2" fill="#f2c94c" opacity="0.85"/>
    <rect x="-50" y="-24" width="248" height="4" rx="2" fill="#f2c94c" filter="url(#softGlow)" opacity="0.5"/>

    <!-- ── TAGLINE ── -->
    <text x="0" y="30" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="400" letter-spacing="5" fill="#7a90b8" text-anchor="middle">EPIDEMIOLOGY  ·  AI  ·  DATA  ·  EVIDENCE  ·  ACTION</text>

    <!-- ── DIVIDER LINE ── -->
    <line x1="-380" y1="60" x2="380" y2="60" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- ── SUBTITLE ── -->
    <text x="0" y="96" font-family="'Segoe UI', Arial, sans-serif" font-size="17" font-weight="300" letter-spacing="0.5" fill="#7a90b8" text-anchor="middle" opacity="0.85">Population analytics built for inference and real-world decisions</text>

    <!-- ── PILLARS ROW ── -->
    <g transform="translate(0, 150)">
      <!-- Pillar 1 -->
      <g transform="translate(-340, 0)">
        <rect x="-80" y="-20" width="160" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="0" y="2" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4dd9e8" text-anchor="middle">DIGITAL EPI</text>
        <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="300" fill="#7a90b8" text-anchor="middle">Real-world signals</text>
      </g>
      <!-- Pillar 2 -->
      <g transform="translate(-170, 0)">
        <rect x="-80" y="-20" width="160" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="0" y="2" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4dd9e8" text-anchor="middle">AI METHODS</text>
        <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="300" fill="#7a90b8" text-anchor="middle">Scalable analytics</text>
      </g>
      <!-- Pillar 3 -->
      <g transform="translate(0, 0)">
        <rect x="-80" y="-20" width="160" height="50" rx="10" fill="rgba(242,201,76,0.08)" stroke="rgba(242,201,76,0.25)" stroke-width="1"/>
        <text x="0" y="2" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#f2c94c" text-anchor="middle">STANFORD</text>
        <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="300" fill="#7a90b8" text-anchor="middle">Active 2026</text>
      </g>
      <!-- Pillar 4 -->
      <g transform="translate(170, 0)">
        <rect x="-80" y="-20" width="160" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="0" y="2" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4dd9e8" text-anchor="middle">GEOSPATIAL</text>
        <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="300" fill="#7a90b8" text-anchor="middle">Access mapping</text>
      </g>
      <!-- Pillar 5 -->
      <g transform="translate(340, 0)">
        <rect x="-80" y="-20" width="160" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
        <text x="0" y="2" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#4dd9e8" text-anchor="middle">HEALTH EQUITY</text>
        <text x="0" y="18" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="300" fill="#7a90b8" text-anchor="middle">Equity by design</text>
      </g>
    </g>

  </g>

  <!-- ── IMPACT STATS — bottom bar ── -->
  <g transform="translate(0, 920)">
    <rect x="160" y="0" width="1600" height="80" rx="16" fill="rgba(255,255,255,0.025)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Stat 1 -->
    <text x="400" y="28" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#f2c94c" text-anchor="middle">75,000+</text>
    <text x="400" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#7a90b8" text-anchor="middle">CITATIONS</text>

    <line x1="600" y1="15" x2="600" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Stat 2 -->
    <text x="760" y="28" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#f2c94c" text-anchor="middle">h-index 45+</text>
    <text x="760" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#7a90b8" text-anchor="middle">GOOGLE SCHOLAR</text>

    <line x1="960" y1="15" x2="960" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Stat 3 -->
    <text x="1160" y="28" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#f2c94c" text-anchor="middle">Top 2%</text>
    <text x="1160" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#7a90b8" text-anchor="middle">SCIENTIST WORLDWIDE</text>

    <line x1="1360" y1="15" x2="1360" y2="65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- Stat 4 -->
    <text x="1520" y="28" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif" font-size="26" font-weight="900" fill="#f2c94c" text-anchor="middle">2019–2026</text>
    <text x="1520" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400" letter-spacing="1.5" fill="#7a90b8" text-anchor="middle">PLATFORM ACTIVE</text>
  </g>

  <!-- ── URL footer ── -->
  <text x="960" y="1060" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" letter-spacing="3" fill="#7a90b8" text-anchor="middle" opacity="0.6">EPIAIDEA.COM</text>

</svg>
